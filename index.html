<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肝臓と腎臓｜生物基礎クイズ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a43;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}main{max-width:820px;margin:35px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 8px 35px #17324d12}h1{font-size:28px;margin:0 0 8px}h2{font-size:24px;line-height:1.55}p{line-height:1.8}.muted{color:#60758b}.tags{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.tag{border:1px solid #c9d9e7;background:white;border-radius:30px;padding:11px 17px;cursor:pointer;font-weight:bold}.tag.active{background:#087bce;color:white;border-color:#087bce}.primary{background:#087bce;color:white;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer}.secondary{background:white;border:1px solid #c9d9e7;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.choice{text-align:left;background:white;border:1px solid #c9d9e7;border-radius:12px;padding:20px 16px;font-size:17px;font-weight:700;color:#142f47;cursor:pointer;min-height:75px}.choice:disabled{cursor:default}.choice.correct{background:#e1f6ea;border-color:#24ae6c}.choice.wrong{background:#ffe9e9;border-color:#e54b4b}.feedback{background:#eef4f9;border-radius:13px;padding:18px 20px;margin:15px 0;line-height:1.85}.feedback strong{font-size:18px}.bar{height:10px;background:#e4edf4;border-radius:8px;overflow:hidden;margin:15px 0 28px}.bar>div{height:100%;background:#1289d5}.actions{display:flex;gap:10px;flex-wrap:wrap}.hide{display:none}.eyebrow{font-weight:700;color:#087bce}footer{color:#63798b;font-size:13px;margin-top:24px}@media(max-width:600px){main{margin:0;min-height:100vh;padding:24px 17px;border-radius:0}.choices{grid-template-columns:1fr}h2{font-size:21px}}</style></head><body><main><section id="home"><div class="eyebrow">生物基礎 PART 12</div><h1>肝臓と腎臓 クイズ</h1><p class="muted">4択で重要事項を確認しましょう。解答後には解説が表示されます。</p><h3>出題分野を選ぶ</h3><div id="tags" class="tags"></div><p>出題数：<b id="count"></b></p><button class="primary" id="start">クイズを始める</button><footer>学習記録の送信・保存は行いません。</footer></section><section id="quiz" class="hide"><div class="eyebrow" id="category"></div><div class="muted" id="progressText"></div><div class="bar"><div id="progress"></div></div><h2 id="question"></h2><div id="choices" class="choices"></div><div id="feedback" class="feedback hide"></div><div class="actions"><button id="next" class="primary hide">次の問題へ</button><button id="back" class="secondary">最初に戻る</button></div></section><section id="result" class="hide"><h1>結果発表</h1><h2 id="resultScore"></h2><p>間違えた問題だけをもう一度解くこともできます。</p><div class="actions"><button class="primary" id="retryAll">もう一度挑戦</button><button class="secondary" id="retryMissed">間違えた問題だけ復習</button><button class="secondary" id="goHome">分野選択に戻る</button></div></section></main><script>const BANK=[{"cat":"肝臓の構造","q":"肝臓を構成する、ほぼ六角柱状の構造単位を何という？","a":"肝小葉","opts":["ネフロン","腎小体","胆のう"],"ex":"肝臓には多数の肝小葉があり、その内部に肝細胞が集まっている。"},{"cat":"肝臓の構造","q":"消化管で吸収された栄養分を多く含む血液が、肝臓へ入るときに通る血管は？","a":"肝門脈","opts":["肝静脈","腎動脈","中心静脈"],"ex":"小腸などからの血液は肝門脈を通って肝臓へ運ばれる。"},{"cat":"肝臓の構造","q":"酸素を多く含む血液を肝臓に送る血管は？","a":"肝動脈","opts":["肝門脈","肝静脈","胆管"],"ex":"肝動脈は肝臓に酸素を供給する。肝門脈は消化管から栄養分を運ぶ。"},{"cat":"肝臓の構造","q":"肝小葉の中心を通り、肝小葉内の血液が集まる静脈は？","a":"中心静脈","opts":["肝門脈","腎静脈","肝動脈"],"ex":"肝小葉内を流れた血液は中心静脈に集まり、最終的に肝静脈を通って肝臓を出る。"},{"cat":"肝臓の構造","q":"肝臓で処理された血液が肝臓から出るときに通る血管は？","a":"肝静脈","opts":["肝門脈","肝動脈","胆管"],"ex":"肝臓を出る血液は肝静脈を通って全身の循環に戻る。"},{"cat":"肝臓の働き","q":"肝臓で、余分なグルコースは主に何に変えられて貯蔵される？","a":"グリコーゲン","opts":["尿素","ビリルビン","ヘモグロビン"],"ex":"肝臓ではグルコースをグリコーゲンとして蓄え、必要に応じて分解して血糖濃度の維持に役立てる。"},{"cat":"肝臓の働き","q":"タンパク質やアミノ酸の分解に伴って生じる、有害な物質は？","a":"アンモニア","opts":["尿素","胆汁","グリコーゲン"],"ex":"アミノ酸などの分解によってアンモニアが生じる。肝臓はこれを毒性の低い尿素に変える。"},{"cat":"肝臓の働き","q":"肝臓がアンモニアからつくる、毒性の低い物質は？","a":"尿素","opts":["胆汁","ビリルビン","グルコース"],"ex":"肝臓で生成された尿素は血液によって腎臓に運ばれ、尿として排出される。"},{"cat":"肝臓の働き","q":"肝臓がアルコールなどの有害物質を無害化する働きを何という？","a":"解毒作用","opts":["ろ過","再吸収","糖新生"],"ex":"肝臓にはアルコールなどの有害物質を分解・変化させる解毒作用がある。"},{"cat":"肝臓の働き","q":"古くなった赤血球の破壊に関わり、肝臓とともに働く器官は？","a":"ひ臓","opts":["胆のう","すい臓","腎う"],"ex":"古くなった赤血球は主にひ臓や肝臓で処理される。"},{"cat":"肝臓の働き","q":"赤血球に含まれる、酸素の運搬に関わるタンパク質は？","a":"ヘモグロビン","opts":["アルブミン","インスリン","グリコーゲン"],"ex":"赤血球中のヘモグロビンが分解されると、胆汁の材料となるビリルビンが生じる。"},{"cat":"肝臓の働き","q":"ヘモグロビンの分解に由来し、胆汁の材料になる色素は？","a":"ビリルビン","opts":["グリコーゲン","尿素","アンモニア"],"ex":"ビリルビンは古くなった赤血球のヘモグロビンの分解に由来する。"},{"cat":"肝臓の働き","q":"肝臓でつくられ、脂肪の消化を助ける液体は？","a":"胆汁","opts":["原尿","血しょう","尿素"],"ex":"胆汁は肝臓でつくられ、脂肪の消化を助ける。"},{"cat":"肝臓の働き","q":"胆汁が一時的に蓄えられ、濃縮される器官は？","a":"胆のう","opts":["ひ臓","腎う","下垂体後葉"],"ex":"胆汁は肝臓でつくられ、胆のうに蓄えられて濃縮される。"},{"cat":"肝臓の働き","q":"胆汁が最終的に分泌される消化管の部位は？","a":"十二指腸","opts":["大腸","胃","食道"],"ex":"胆汁は胆管を通り、十二指腸に分泌される。"},{"cat":"肝臓の働き","q":"肝臓での活発な化学反応によって生じる熱は、何の保持に役立つ？","a":"体温","opts":["血圧","血糖濃度","血液量"],"ex":"肝臓の代謝活動で発生する熱は、体温の保持にも役立つ。"},{"cat":"腎臓の構造","q":"腎臓で尿を生成する構造上・機能上の単位を何という？","a":"ネフロン","opts":["肝小葉","胆管","腎う"],"ex":"ネフロン（腎単位）は腎小体と細尿管からなる。"},{"cat":"腎臓の構造","q":"ネフロンのうち、糸球体とボーマンのうを合わせた構造は？","a":"腎小体","opts":["集合管","腎う","肝小葉"],"ex":"腎小体は糸球体とボーマンのうで構成され、血液のろ過が行われる。"},{"cat":"腎臓の構造","q":"腎小体で毛細血管が球状に集まった部分は？","a":"糸球体","opts":["集合管","細尿管","輸尿管"],"ex":"糸球体の毛細血管から、血球や大きなタンパク質などを除いた成分がろ過される。"},{"cat":"腎臓の構造","q":"糸球体を包み、ろ過された液体を受け取る袋状の構造は？","a":"ボーマンのう","opts":["胆のう","腎う","集合管"],"ex":"糸球体でろ過された液体はボーマンのうに入り、原尿となる。"},{"cat":"腎臓の構造","q":"腎小体に続き、原尿から必要な物質が再吸収される管は？","a":"細尿管（腎細管）","opts":["輸尿管","胆管","肝静脈"],"ex":"原尿は細尿管を通る間に、グルコースや水、無機塩類などが再吸収される。"},{"cat":"腎臓の構造","q":"細尿管に続き、水の再吸収が行われる管は？","a":"集合管","opts":["肝門脈","胆管","輸尿管"],"ex":"集合管でも水が再吸収され、尿が濃縮される。"},{"cat":"腎臓の構造","q":"腎臓の中心部にあり、つくられた尿が集まる場所は？","a":"腎う","opts":["ボーマンのう","糸球体","胆のう"],"ex":"尿は集合管から腎うに集まり、輸尿管を通ってぼうこうへ送られる。"},{"cat":"尿の生成","q":"糸球体で血液から液体成分をこし出す過程を何という？","a":"ろ過","opts":["再吸収","解毒","合成"],"ex":"糸球体でろ過された液体はボーマンのうに入り、原尿となる。"},{"cat":"尿の生成","q":"血液からろ過されてでき、細尿管へ送られる液体は？","a":"原尿","opts":["胆汁","血しょう","リンパ液"],"ex":"原尿には水、グルコース、尿素、無機塩類などが含まれる。"},{"cat":"尿の生成","q":"健康な人の糸球体で、通常ほとんどろ過されない成分の組み合わせは？","a":"血球とタンパク質","opts":["グルコースと水","尿素と無機塩類","水と尿素"],"ex":"血球や大きなタンパク質は通常、糸球体を通過しにくい。"},{"cat":"尿の生成","q":"原尿中の必要な物質が細尿管などから血液へ戻る過程は？","a":"再吸収","opts":["ろ過","解毒作用","胆汁分泌"],"ex":"細尿管などで、原尿中のグルコース、水、無機塩類などが周囲の毛細血管へ戻る。"},{"cat":"尿の生成","q":"健康な人では、原尿中のグルコースは通常何％再吸収される？","a":"100％","opts":["0％","約25％","約50％"],"ex":"健康な人では、グルコースは通常ほぼすべて再吸収され、尿中に排出されない。"},{"cat":"尿の生成","q":"水の再吸収を促進するホルモンは？","a":"バソプレシン","opts":["インスリン","グルカゴン","アドレナリン"],"ex":"バソプレシンは視床下部でつくられ、下垂体後葉から分泌される。腎臓で水の再吸収を促す。"},{"cat":"尿の生成","q":"腎うからぼうこうへ尿を運ぶ管は？","a":"輸尿管","opts":["細尿管","胆管","集合管"],"ex":"腎うに集まった尿は輸尿管を通り、ぼうこうに蓄えられる。"},{"cat":"濃縮率","q":"尿中の濃度を血しょう中の濃度で割った値を何という？","a":"濃縮率","opts":["再吸収率","ろ過量","血糖濃度"],"ex":"濃縮率＝尿中の濃度÷血しょう中の濃度。"},{"cat":"濃縮率","q":"ある物質の血しょう中濃度が0.001％、尿中濃度が0.075％のとき、濃縮率は？","a":"75倍","opts":["7.5倍","0.75倍","750倍"],"ex":"0.075÷0.001＝75。濃縮率は75倍となる。"},{"cat":"濃縮率","q":"濃縮率が75倍の物質Aと7.5倍の物質Bでは、一般にどちらが再吸収されやすいと考えられる？","a":"物質B","opts":["物質A","両方同じ","濃縮率からは絶対に判断できない"],"ex":"この学習では、濃縮率が低い物質ほど再吸収されやすいと考える。AよりBの方が濃縮率が低い。"},{"cat":"濃縮率","q":"尿素のように再吸収されにくい老廃物の濃縮率は、一般にどうなる？","a":"高くなる","opts":["低くなる","必ず1倍になる","必ず0倍になる"],"ex":"水が再吸収される一方、尿素などは尿中に残りやすいため濃縮率が高くなる。"}];let selected='すべて',order=[],index=0,score=0,missed=[],locked=false;const $=id=>document.getElementById(id);const shuffle=a=>{let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};const cats=['すべて',...new Set(BANK.map(x=>x.cat))];$('tags').innerHTML=cats.map(x=>`<button class="tag ${x===selected?'active':''}" data-cat="${x}">${x}</button>`).join('');document.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;document.querySelectorAll('.tag').forEach(t=>t.classList.toggle('active',t===b));$('count').textContent=BANK.filter(q=>selected==='すべて'||q.cat===selected).length+'問';});$('count').textContent=BANK.length+'問';function start(items){order=shuffle(items);index=0;score=0;missed=[];$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');render()}$('start').onclick=()=>start(BANK.filter(q=>selected==='すべて'||q.cat===selected));$('back').onclick=()=>{$('quiz').classList.add('hide');$('home').classList.remove('hide')};function render(){locked=false;let q=order[index];$('category').textContent=q.cat;$('progressText').textContent=`${index+1} / ${order.length} 問`;$('progress').style.width=((index+1)/order.length*100)+'%';$('question').textContent=q.q;$('feedback').classList.add('hide');$('next').classList.add('hide');$('choices').innerHTML='';shuffle([q.a,...q.opts]).forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(x);$('choices').append(b)})}function answer(v){if(locked)return;locked=true;let q=order[index],ok=v===q.a;if(ok)score++;else missed.push(q);document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('correct');else if(b.textContent===v)b.classList.add('wrong')});$('feedback').innerHTML=`<strong>${ok?'⭕ 正解！':'❌ 不正解　正解：'+q.a}</strong><p><b>解説：</b>${q.ex}</p>`;$('feedback').classList.remove('hide');$('next').classList.remove('hide');$('next').textContent=index===order.length-1?'結果を見る':'次の問題へ'}$('next').onclick=()=>{index++;if(index<order.length)render();else finish()};function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');$('resultScore').textContent=`${score} / ${order.length} 問正解（正答率 ${Math.round(score/order.length*100)}％）`;$('retryMissed').style.display=missed.length?'inline-block':'none'}$('retryAll').onclick=()=>start(BANK.filter(q=>selected==='すべて'||q.cat===selected));$('retryMissed').onclick=()=>start(missed);$('goHome').onclick=()=>{$('result').classList.add('hide');$('home').classList.remove('hide')};</script></body></html>
